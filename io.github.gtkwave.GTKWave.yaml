app-id: io.github.gtkwave.GTKWave
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gtkwave
rename-icon: gtkwave
rename-desktop-file: gtkwave.desktop
finish-args:
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=cups
cleanup:
  - /include
  - /man
  - /share/man
modules:
  - name: tcl
    subdir: unix
    post-install:
      - chmod 755 /app/lib/lib*tcl*.so
    sources:
      - type: archive
        url: https://sourceforge.net/projects/tcl/files/Tcl/8.6.18/tcl8.6.18-src.tar.gz
        sha256: 14f9af32b1767ff718477a8f974ad03c34341097e6b43f4ce54644ee974e268e
        x-checker-data:
          type: html
          url: https://sourceforge.net/projects/tcl/rss
          pattern: <link>(https://sourceforge.net/.+/tcl([\d\.]+\d)-src.tar.gz)/download</link>
          versions:
            <: '9.0'  # Stop flathubbot checking for version 9.0
  - name: tk
    subdir: unix
    post-install:
      - chmod 755 /app/lib/lib*tk*.so
    cleanup:
      - /lib/tk*/demos
    sources:
      - type: archive
        url: https://sourceforge.net/projects/tcl/files/Tcl/8.6.18/tk8.6.18-src.tar.gz
        sha256: 95cd528a80f5e4bdb557af9b14a7197d6860793a3894e25e7c9fad2ed05d4c3c
        x-checker-data:
          type: html
          url: https://sourceforge.net/projects/tcl/rss
          pattern: <link>(https://sourceforge.net/.+/tk([\d\.]+\d)-src.tar.gz)/download</link>
          versions:
            <: '9.0'  # Stop flathubbot checking for version 9.0

  - name: gtkwave
    config-opts:
      - --enable-gtk3
      - --enable-manymarkers
      - --disable-dependency-tracking
      - --disable-mime-update
    post-install:
      - install -Dm644 share/appdata/io.github.gtkwave.GTKWave.metainfo.xml /app/share/metainfo/io.github.gtkwave.GTKWave.metainfo.xml
      - |
        for mime in share/mime/packages/x-gtkwave-extension-*.xml; do
          install -Dm644 "${mime}" "/app/share/mime/packages/io.github.gtkwave.GTKWave-$(basename "${mime#share/mime/packages/x-gtkwave-extension-}")"
        done
    sources:
      - type: archive
        url: https://sourceforge.net/projects/gtkwave/files/gtkwave-gtk3-3.3.128/gtkwave-gtk3-3.3.128.tar.gz
        sha256: 817e197fc1808f8aac3543c2c2f9683cb01368c91192b8eae5af58070ef1d1f8
        x-checker-data:
          type: html
          url: https://sourceforge.net/projects/gtkwave/rss
          pattern: <link>(https://sourceforge.net/.+/gtkwave-gtk3-([\d\.]+\d).tar.gz)/download</link>
      - type: patch
        path: appdata.patch
